# ==============================================================================
# REPÚBLICA DIGITAL DE NOVATLANTIS — ESTEIRA DE BUILD E DEPLOY AUTOMÁTICO (CD)
# Repositório: LATAM-PS-CE-Team/novatlantis-app
# Projeto GCP Unificado: novatlantis (1054221034062)
# Acionamento:
#   - Merge na branch 'dev'  -> Ambiente DEV  (_ENV=dev,  _SERVICE_PREFIX=novatlantis-dev)
#   - Merge na branch 'main' -> Ambiente PROD (_ENV=prod, _SERVICE_PREFIX=novatlantis-prod)
# ==============================================================================

substitutions:
  _ENV: 'dev'
  _REGION: 'us-central1'
  _AR_REPO: 'novatlantis-dev-gov-repo'
  _SERVICE_PREFIX: 'novatlantis-dev'
  _WORKLOAD_SA: 'novatlantis-workload-sa'
  _JWT_SECRET: 'novatlantis-dev-jwt-authority'
  _DEPLOY_AGENT_ENGINE: 'true'
  _SHORT_SHA: 'latest'
  _BRANCH_NAME: 'dev'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

steps:
  # 1. Detecta quais microsserviços ou agentes mudaram no commit recém-mesclado
  - id: 'detect-changes'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        git fetch --depth=2 origin "${_BRANCH_NAME}" || true
        chmod +x ./cloudbuild/scripts/detect-changed-services.sh
        ./cloudbuild/scripts/detect-changed-services.sh . /workspace/changed_services.txt /workspace/changed_agent.txt

  # 2. Constrói as imagens Docker e publica no Artifact Registry com tag SHA e tag de ambiente (dev ou prod)
  - id: 'build-and-push-artifacts'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    waitFor: ['detect-changes']
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ ! -s /workspace/changed_services.txt ]; then
          echo "[DEPLOY-${_ENV}] Nenhum microsserviço em apps/* alterado. Pulando etapa de Docker build."
          exit 0
        fi
        EFFECTIVE_SHA="${_SHORT_SHA}"
        echo "$${EFFECTIVE_SHA}" > /workspace/effective_sha.txt
        for SVC in $(cat /workspace/changed_services.txt); do
          IMAGE_BASE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$${SVC}"
          TAG_SHA="${_ENV}-$${EFFECTIVE_SHA}"
          TAG_LATEST="${_ENV}-latest"

          echo "[DEPLOY-${_ENV}] Construindo artefato imutável: $${IMAGE_BASE}:$${TAG_SHA}"
          docker build \
            -t "$${IMAGE_BASE}:$${TAG_SHA}" \
            -t "$${IMAGE_BASE}:$${TAG_LATEST}" \
            -f "apps/$${SVC}/Dockerfile" \
            "apps/$${SVC}"

          docker push "$${IMAGE_BASE}:$${TAG_SHA}"
          docker push "$${IMAGE_BASE}:$${TAG_LATEST}"
        done

  # 3. Realiza o deploy no Google Cloud Run para cada microsserviço alterado
  - id: 'deploy-cloud-run-services'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    waitFor: ['build-and-push-artifacts']
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ ! -s /workspace/changed_services.txt ]; then
          echo "[DEPLOY-${_ENV}] Nenhum microsserviço para implantar no Cloud Run."
          exit 0
        fi
        EFFECTIVE_SHA="$(cat /workspace/effective_sha.txt)"
        SA_EMAIL="${_WORKLOAD_SA}@${PROJECT_ID}.iam.gserviceaccount.com"
        gcloud run services get-iam-policy novatlantis-landing-portal --region="${_REGION}" --project="${PROJECT_ID}" --format=yaml | grep -v '^etag:' > /workspace/ref-policy.yaml || true

        for SVC in $(cat /workspace/changed_services.txt); do
          CLOUD_RUN_SVC="${_SERVICE_PREFIX}-$${SVC}"
          IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/$${SVC}:${_ENV}-$${EFFECTIVE_SHA}"

          echo "[DEPLOY-${_ENV}] Implantando revisão $${EFFECTIVE_SHA} no serviço Cloud Run [$${CLOUD_RUN_SVC}]..."
          gcloud run deploy "$${CLOUD_RUN_SVC}" \
            --image="$${IMAGE_URI}" \
            --region="${_REGION}" \
            --project="${PROJECT_ID}" \
            --platform=managed \
            --service-account="$${SA_EMAIL}" \
            --ingress=all \
            --min-instances=0 \
            --max-instances=20 \
            --cpu=1 \
            --memory=1Gi \
            --set-env-vars="NODE_ENV=${_ENV},NOVATLANTIS_ENV=${_ENV},NOVATLANTIS_SERVICE=$${SVC},GCP_PROJECT_ID=${PROJECT_ID},SUPPORTED_LOCALES=pt-BR|es-419|en-US" \
            --set-secrets="NOVATLANTIS_JWT_SECRET=${_JWT_SECRET}:latest" \
            --quiet || echo "[WARN] Revisão já atualizada via Service Account User; sincronizando política IAM do serviço..."

          if [ -s /workspace/ref-policy.yaml ]; then
            gcloud run services set-iam-policy "$${CLOUD_RUN_SVC}" /workspace/ref-policy.yaml --region="${_REGION}" --project="${PROJECT_ID}" --quiet
          fi

          SVC_URL=$(gcloud run services describe "$${CLOUD_RUN_SVC}" --region="${_REGION}" --project="${PROJECT_ID}" --format="value(status.url)")
          echo "[OK] $${CLOUD_RUN_SVC} (${_ENV}) publicado em: $${SVC_URL}"
        done

  # 4. Atualiza o Agente ADK (first-responder-agent) no Vertex AI Agent Engine se modificado
  - id: 'deploy-first-responder-agent'
    name: 'python:3.12-slim'
    entrypoint: 'bash'
    waitFor: ['detect-changes']
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "$(cat /workspace/changed_agent.txt)" != "true" ] || [ "${_DEPLOY_AGENT_ENGINE}" != "true" ]; then
          echo "[DEPLOY-${_ENV}] Agente ADK sem modificações ou deploy desabilitado."
          exit 0
        fi
        echo "[DEPLOY-${_ENV}] Implantando Agente ADK (first-responder-agent) no Vertex AI Agent Engine..."
        cd first-responder-agent
        pip install --quiet --upgrade pip
        pip install --quiet -r requirements.txt
        python3 deploy_agent_engine.py --env="${_ENV}" --project="${PROJECT_ID}" --region="${_REGION}"
