<!DOCTYPE html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Governo de Novatlantis — Portal de Serviços Públicos</title>
    <meta
      name="description"
      content="Portal de serviços públicos digitais de Novatlantis: Identidade NID, Saúde, Educação, Justiça, Tesouro e Atendimento Urbano."
    />
    <link rel="icon" type="image/jpeg" href="/assets/coat-of-arms-novatlantis.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Roboto+Mono:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'surface': '#f8f9fa',
              'surface-dim': '#e8eaed',
              'surface-bright': '#ffffff',
              'surface-container-lowest': '#ffffff',
              'surface-container-low': '#f1f3f4',
              'surface-container': '#e8eaed',
              'surface-container-high': '#dadce0',
              'surface-container-highest': '#bdc1c6',
              'on-surface': '#202124',
              'on-surface-variant': '#5f6368',
              'primary': '#1a73e8',
              'primary-container': '#e8f0fe',
              'on-primary': '#ffffff',
              'on-primary-container': '#174ea6',
              'secondary': '#1e8e3e',
              'secondary-container': '#e6f4ea',
              'on-secondary': '#ffffff',
              'tertiary': '#f9ab00',
              'error': '#d93025',
              'error-container': '#fce8e6',
              'outline': '#dadce0',
              'outline-variant': '#e8eaed'
            },
            fontFamily: {
              headline: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              body: ['Inter', 'Roboto', 'sans-serif'],
              label: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
              mono: ['"Roboto Mono"', 'monospace'],
              sans: ['Inter', 'Roboto', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      body {
        font-family: 'Inter', 'Roboto', sans-serif;
        background-color: #f8f9fa;
        color: #202124;
      }
      h1, h2, h3, h4, .font-headline, .font-serif-authority {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body class="bg-[#f8f9fa] text-[#202124] antialiased selection:bg-[#1a73e8] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
